            api_host: 'https://us.i.posthog.com',

    <script defer src="/static/js/posthog-identify.js"></script>
    
    <script src="https://js.stripe.com/v3/"></script>
    <script>
      const checkout_public_key = '{{checkout_public_key}}';
      const checkout_session_id = '{{checkout_session_id}}';
      const stripe = Stripe(checkout_public_key);
      
      // Immediately attempt to redirect to checkout
      stripe.redirectToCheckout({
        sessionId: checkout_session_id
      }).then(function (result) {
        if (result.error) {
          document.getElementById("loadingMessage").innerText = "Error: " + result.error.message;
        }
      });
    </script>

      .loading-container {
        text-align: center;
      }
      .spinner-border {
        width: 3rem;
        height: 3rem;
      }

    <div class="loading-container">
      <h1 class="display-4">Redirecting to Checkout...</h1>
      <p class="lead">Please wait while we take you to the payment page.</p>
      <div id="loadingMessage">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>
