	<style>
		body { margin: 0; font-family: 'Poppins', sans-serif; background: #f5f7fa; }
		@keyframes slideUp {
			from {
				opacity: 0;
				transform: translateY(20px) scale(0.95);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}
		.animate-slide-up {
			animation: slideUp 0.3s ease-out;
		}
	</style>
</head>
<body>
	<div id="root"></div>
	<script type="text/babel">
		// Pass login_success flag to React component
		window.loginSuccess = {% if login_success == 'true' %}true{% else %}false{% endif %};
	</script>
	<script type="text/babel" src="{{ url_for('static', filename='js/mobile-landing.js') }}?v={{ range(1000, 9999) | random }}"></script>
</body>
